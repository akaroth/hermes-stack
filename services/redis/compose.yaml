# redis. profile [redis] — pulled in via SERVICE_REQUIRES=redis. Project-scoped (no
# container_name / no shared network). Siblings reach it at host `redis`.

services:
  redis:
    image: "redis:${REDIS_VERSION}"
    profiles: [redis]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
